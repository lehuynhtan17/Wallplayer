name: Build and release

# Every push: build Wallplayer.exe on Windows (download it from the run to test).
# "Run workflow" with "Publish a release" ticked, or pushing a tag V<version>: build Windows, Linux
# and macOS, sign Windows with SignPath (once the SIGNPATH_* settings exist), then publish release
# V<version> with one zip per system and the notes from CHANGELOG.md.
# "Run workflow" with the box unticked: the same builds and zips as a dry run, nothing is published
# (the zips are kept as downloads on the run page).
#
# The Linux / macOS build steps match the test builds in build-unix.yml: keep them in step.
# The zip names are what the app's updater looks for (src-tauri/src/update.rs): do not rename them.

on:
  push:
    branches: [main, custom]
    tags: ['V*']
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (version from src-tauri/Cargo.toml, notes from CHANGELOG.md). Untick for a dry run."
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/V') }}
      ALL_SYSTEMS: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/V') }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $c = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($v -ne $c) { throw "Version mismatch: Cargo.toml says $v, tauri.conf.json says $c" }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "V$v") { throw "Tag ${{ github.ref_name }} does not match the version V$v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Wallplayer $v"

      - name: Check the release does not exist yet
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "V${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release V${{ steps.ver.outputs.version }} already exists: raise the version first." }
          exit 0

      - name: Release notes from CHANGELOG.md
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = @(); $on = $false
          foreach ($l in (Get-Content CHANGELOG.md -Encoding utf8)) {
            if ($l -match '^## ') {
              if ($on) { break }
              if ($l -match ("^## \[?" + [regex]::Escape($v) + "\]?\b")) { $on = $true; continue }
            }
            if ($on) { $out += $l }
          }
          $notes = ($out -join "`n").Trim()
          if (-not $notes) { throw "CHANGELOG.md has no '## $v' section." }
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Wallplayer | Out-Null
          Copy-Item src-tauri/target/release/wallplayer.exe dist/Wallplayer/Wallplayer.exe
          $dll = Get-ChildItem src-tauri/target/release -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName dist/Wallplayer/ }
          foreach ($f in "GUIDE.txt", "HUONG-DAN.txt") {
            $t = [IO.File]::ReadAllText("$PWD/$f") -replace "`r?`n", "`r`n"
            [IO.File]::WriteAllText("$PWD/dist/Wallplayer/$f", $t, (New-Object Text.UTF8Encoding $false))
          }

      - name: Upload build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Wallplayer-Windows-x64
          path: dist

      # Approve the request in SignPath (e-mail / dashboard) within 4 hours.
      - name: Sign with SignPath
        if: env.PUBLISH == 'true' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed

      - name: Zip
        if: env.ALL_SYSTEMS == 'true'
        shell: pwsh
        run: |
          $root = "dist"
          if (Test-Path signed/Wallplayer/Wallplayer.exe) { $root = "signed"; Write-Host "Signed by SignPath" }
          else { Write-Host "::warning::Unsigned build: SignPath is not set up yet" }
          Push-Location $root
          7z a -tzip ../Wallplayer-Windows-x64.zip Wallplayer
          Pop-Location

      - name: Keep the zip for the release
        if: env.ALL_SYSTEMS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            Wallplayer-Windows-x64.zip
            notes.md
          if-no-files-found: warn

  linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-22.04   # the oldest supported Ubuntu: the program then also runs on newer systems
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (GTK, WebKitGTK, tray)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Zip
        run: |
          mkdir -p dist/Wallplayer
          cp src-tauri/target/release/wallplayer dist/Wallplayer/wallplayer
          chmod +x dist/Wallplayer/wallplayer
          cp GUIDE.txt HUONG-DAN.txt dist/Wallplayer/
          cp src-tauri/icons/128x128.png dist/Wallplayer/wallplayer.png
          cd dist && zip -r ../Wallplayer-Linux-x64.zip Wallplayer

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: Wallplayer-Linux-x64.zip

  macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/V')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Wallplayer.app (Apple silicon + Intel)
        working-directory: src-tauri
        run: |
          npx --yes @tauri-apps/cli@2 icon icons/icon.png -o /tmp/wp-icons
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app \
            --config '{"bundle":{"active":true,"icon":["/tmp/wp-icons/32x32.png","/tmp/wp-icons/128x128.png","/tmp/wp-icons/128x128@2x.png","/tmp/wp-icons/icon.icns"]}}'

      - name: Zip
        run: |
          mkdir -p dist/Wallplayer
          cp -R src-tauri/target/universal-apple-darwin/release/bundle/macos/Wallplayer.app dist/Wallplayer/
          codesign --force --deep --sign - dist/Wallplayer/Wallplayer.app
          cp GUIDE.txt HUONG-DAN.txt dist/Wallplayer/
          cd dist && ditto -c -k --sequesterRsrc --keepParent Wallplayer ../Wallplayer-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: Wallplayer-macOS.zip

  # One release, one zip per system. Runs only when all three builds worked, so a release never
  # misses a system. Unticked "Publish a release": a dry run that checks the zips and stops there.
  release:
    needs: [build, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/V') }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: Check the three zips
        run: |
          cd out
          for z in Wallplayer-Windows-x64.zip Wallplayer-Linux-x64.zip Wallplayer-macOS.zip; do
            [ -s "$z" ] || { echo "::error::$z is missing"; exit 1; }
          done
          # the updater takes the program out of the Wallplayer folder in each zip
          unzip -l Wallplayer-Windows-x64.zip | grep -Eq ' Wallplayer[/\\]Wallplayer\.exe$' || { echo "::error::Windows zip has no Wallplayer/Wallplayer.exe"; exit 1; }
          unzip -l Wallplayer-Linux-x64.zip | grep -q ' Wallplayer/wallplayer$' || { echo "::error::Linux zip has no Wallplayer/wallplayer"; exit 1; }
          unzip -l Wallplayer-macOS.zip | grep -q ' Wallplayer/Wallplayer.app/Contents/MacOS/' || { echo "::error::macOS zip has no Wallplayer/Wallplayer.app"; exit 1; }
          ls -l *.zip

      - name: Which zip for which system (added under the notes)
        run: |
          [ -f out/notes.md ] || echo "(dry run: no notes)" > out/notes.md
          cat >> out/notes.md <<'EOF'

          ### Downloads
          | System | File |
          |---|---|
          | Windows 10 / 11 (64-bit) | `Wallplayer-Windows-x64.zip` |
          | Linux, 64-bit (preview): Ubuntu 22.04 or newer, or any system with WebKitGTK 4.1 | `Wallplayer-Linux-x64.zip` |
          | macOS, Apple silicon and Intel (preview, not notarized: the first time, right-click the app → Open) | `Wallplayer-macOS.zip` |
          EOF
          cat out/notes.md

      - name: Publish release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          gh release create "V$VERSION" Wallplayer-Windows-x64.zip Wallplayer-Linux-x64.zip Wallplayer-macOS.zip \
            --repo "${{ github.repository }}" --title "Wallplayer V$VERSION" --notes-file notes.md --target "${{ github.sha }}"

      - name: Dry run
        if: env.PUBLISH != 'true'
        run: echo "::notice::Dry run, nothing published. Would publish V$VERSION with the three zips above."
