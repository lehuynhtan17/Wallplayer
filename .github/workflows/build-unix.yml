name: Linux and macOS (test builds)

# Builds Wallplayer for Linux and macOS, runs it on GitHub's Linux machine and real Mac, and records
# each test run as a video with captions. Also builds Windows from the same code (to be sure the port
# did not break it). Everything is kept as downloads on the run page; nothing is published: releases
# (one zip per system) come from build.yml, whose Linux / macOS build steps match the ones here.

on:
  push:
    branches: [main, custom, 'port/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (GTK, WebKitGTK, tray) and the test desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            xvfb openbox pcmanfm stalonetray xterm x11-utils x11-xserver-utils xdotool wmctrl imagemagick ffmpeg \
            pulseaudio pulseaudio-utils dbus-x11 python3-dbus python3-gi fonts-noto-core gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist/Wallplayer
          cp src-tauri/target/release/wallplayer dist/Wallplayer/wallplayer
          chmod +x dist/Wallplayer/wallplayer
          cp GUIDE.txt HUONG-DAN.txt dist/Wallplayer/
          cp src-tauri/icons/128x128.png dist/Wallplayer/wallplayer.png
          cd dist && zip -r ../Wallplayer-Linux-x64.zip Wallplayer

      - uses: actions/upload-artifact@v4
        with:
          name: Wallplayer-Linux-x64
          path: Wallplayer-Linux-x64.zip

      - name: Test run (recorded)
        run: bash .github/scripts/test-linux.sh "$PWD/dist/Wallplayer/wallplayer" "$PWD/test-linux"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-video-Linux
          path: test-linux

  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Wallplayer.app (Apple silicon + Intel)
        working-directory: src-tauri
        run: |
          npx --yes @tauri-apps/cli@2 icon icons/icon.png -o /tmp/wp-icons
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app \
            --config '{"bundle":{"active":true,"icon":["/tmp/wp-icons/32x32.png","/tmp/wp-icons/128x128.png","/tmp/wp-icons/128x128@2x.png","/tmp/wp-icons/icon.icns"]}}'

      - name: Package
        run: |
          mkdir -p dist/Wallplayer
          cp -R src-tauri/target/universal-apple-darwin/release/bundle/macos/Wallplayer.app dist/Wallplayer/
          codesign --force --deep --sign - dist/Wallplayer/Wallplayer.app
          cp GUIDE.txt HUONG-DAN.txt dist/Wallplayer/
          cd dist && ditto -c -k --sequesterRsrc --keepParent Wallplayer ../Wallplayer-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Wallplayer-macOS
          path: Wallplayer-macOS.zip

      - name: Test run (recorded)
        run: |
          brew install ffmpeg > /dev/null
          bash .github/scripts/test-macos.sh "$PWD/dist/Wallplayer/Wallplayer.app" "$PWD/test-macos"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-video-macOS
          path: test-macos

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Wallplayer | Out-Null
          Copy-Item src-tauri/target/release/wallplayer.exe dist/Wallplayer/Wallplayer.exe
          $dll = Get-ChildItem src-tauri/target/release -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName dist/Wallplayer/ }
          Copy-Item GUIDE.txt, HUONG-DAN.txt dist/Wallplayer/

      - uses: actions/upload-artifact@v4
        with:
          name: Wallplayer-Windows-x64-port-test
          path: dist

  # Puts the two test videos (captions added here) and the check lists on the "test-videos" branch,
  # replaced at every run, so they can be watched without unzipping artifacts.
  videos:
    needs: [linux, macos]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Test-video-Linux
          path: in/linux

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Test-video-macOS
          path: in/macos

      - name: Captions for the macOS video
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
          mkdir -p out
          if [ -s in/macos/raw.mp4 ] && [ -s in/macos/steps.tsv ]; then
            bash .github/scripts/caption-video.sh in/macos/raw.mp4 in/macos/steps.tsv out/wallplayer-macos-test.mp4
          fi
          cp in/linux/wallplayer-linux-test.mp4 out/ 2>/dev/null || true
          cp in/linux/checks.txt out/checks-linux.txt 2>/dev/null || true
          cp in/macos/checks.txt out/checks-macos.txt 2>/dev/null || true
          mkdir -p out/macos-windows && cp in/macos/windows-*.txt out/macos-windows/ 2>/dev/null || true
          ls -la out

      - name: Publish to the test-videos branch
        working-directory: out
        run: |
          printf '# Wallplayer test videos\n\nRun %s on %s (commit %s). Replaced at every run.\n' "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" "$GITHUB_SHA" > README.md
          git init -q -b test-videos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Test videos for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-videos
