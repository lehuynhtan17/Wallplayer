<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Wallplayer</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --accent:255,255,255; --accent2:255,255,255; --clock:rgba(255,255,255,.92);
  --amb:.35; --W:100vw; --H:100vh;
  --glass:rgba(28,28,34,.42); --glass-hi:rgba(255,255,255,.10); --brd:rgba(255,255,255,.16);
  --txt2:rgba(255,255,255,.62); --txt3:rgba(255,255,255,.42);
  --blur:blur(2.2rem) saturate(170%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:min(calc(var(--W) / 144), calc(var(--H) / 90));background:#000}
body{height:100vh;overflow:hidden;background:#000;color:#fff;-webkit-font-smoothing:antialiased;
  font-family:Inter,-apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
#app{position:fixed;left:0;top:0;width:var(--W);height:var(--H);overflow:hidden;background:#07070a}
/* portrait screens (a vertical monitor): fill the whole screen, no letterbox */
@media (max-aspect-ratio:5/4){html{font-size:calc(var(--W) / 112)}
  /* stacked top to bottom: clock · cover flow · playlist (flat) · search + player */
  #app #flowWrap{top:31%;height:24%}
  #app #queue{left:50%!important;top:59%!important;width:56rem;height:21%!important;transform:translateX(-50%)}
  #app #queue.off{transform:translateX(-50%) translateY(1rem)}
  #app #dock{top:auto;bottom:5%}}
#rotateHint{display:none;position:fixed;left:0;right:0;bottom:6vh;text-align:center;font:500 13px Inter,system-ui;color:rgba(255,255,255,.45)}

/* ───────── wallpaper ───────── */
#wall,.wl{position:absolute;inset:0}
.wart{background-size:cover;background-position:center;filter:blur(4.5rem) saturate(1.6) brightness(.62);transform:scale(1.4);opacity:0;transition:opacity 1.4s ease}
.wart.on{opacity:1}
#fx{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.9;transition:opacity 1s}
/* power: nothing animates where nobody looks (covered), lyric loops hold still at rest */
#app.asleep *,#app.asleep *::before,#app.asleep *::after{animation-play-state:paused!important}
#app.rest #lyrics2 *,#app.rest .eq i{animation-play-state:paused}
.custom{object-fit:cover;width:100%;height:100%;opacity:0;transition:opacity 1s}
.custom.on{opacity:1}
#ytWrap{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#ytWrap.on{opacity:1}
/* hide YouTube's own "more videos" / end-screen tiles: the video fades to the cover behind it */
#ytWrap.yt-hide,#ytWrap.yt-end,#ytAudioWrap.yt-hide{opacity:0!important;transition:opacity .25s ease!important}
#ytWrap iframe,#ytHost{position:absolute;left:50%;top:50%;border:0;pointer-events:none;
  width:calc(max(var(--W), calc(var(--H) * 16 / 9)) * var(--vk,1));height:calc(max(var(--H), calc(var(--W) * 9 / 16)) * var(--vk,1));transform:translate(-50%,-50%) scale(calc(1.2 / var(--vk,1)))}
.shade{background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(0,0,0,.45) 100%),linear-gradient(to bottom,rgba(0,0,0,.18),transparent 25%,transparent 60%,rgba(0,0,0,.35));transition:background .6s}
#app.dim .shade{background:rgba(0,0,0,.5)}
#app.hasCustom #fx,#app.mv #fx{opacity:.25}
/* Background → Desktop wallpaper: the Windows wallpaper of this monitor, optionally blurred */
#deskImg{object-fit:cover;width:100%;height:100%;opacity:0;transition:opacity .8s,filter .3s,transform .3s}
#app.deskbg #deskImg.ok,#app.deskfill #deskImg.ok{opacity:1}
#app.deskbg .custom{opacity:0!important}   /* Desktop wallpaper mode wins over a custom image */
#app.deskbg #fx{opacity:0}
#app.clip #deskImg,#app.clip-mirror #deskImg{opacity:0!important}

/* search: heart on YouTube Music playlist cards (save to the library) */
.rc .ra .csave{position:absolute;left:.4rem;top:.4rem;width:2.5rem;height:2.5rem;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(.8rem);backdrop-filter:blur(.8rem);opacity:0;transition:opacity .15s}
.rc:hover .ra .csave,.rc .ra .csave.on{opacity:1}
.rc .ra .csave:hover{background:rgba(0,0,0,.72)}
.rc .ra .csave.on{color:rgb(var(--accent))}
.rc .ra .csave .ico{width:1.35rem;height:1.35rem}
/* mirror (another monitor): same scene, no controls */
#app.mirror #dock,#app.mirror .menu,#app.mirror #toast,#app.mirror #upPill,#app.mirror #upCard,#app.mirror #dropHint,#app.mirror #flowStatus,
#app.mirror #editSheet,#app.mirror #restoreBtn{display:none!important}
#app.mirror,#app.mirror *{pointer-events:none!important}

/* ───────── ambient light ───────── */
#ambient{position:absolute;inset:0;pointer-events:none;z-index:2}
.amb{position:absolute;display:block}
.amb.top,.amb.bottom{left:0;right:0;height:16%}
.amb.top{top:0;background:linear-gradient(to bottom,rgba(var(--accent),calc(var(--amb) * .55)),transparent)}
.amb.bottom{bottom:0;background:linear-gradient(to top,rgba(var(--accent),calc(var(--amb) * .7)),transparent)}
.amb.left,.amb.right{top:0;bottom:0;width:7%}
.amb.left{left:0;background:linear-gradient(to right,rgba(var(--accent2),calc(var(--amb) * .35)),transparent)}
.amb.right{right:0;background:linear-gradient(to left,rgba(var(--accent2),calc(var(--amb) * .35)),transparent)}
.amb.top::before,.amb.bottom::before{content:"";position:absolute;left:0;right:0;height:.35rem;background:rgba(var(--accent),calc(.25 + var(--amb) * .75));
  box-shadow:0 0 1.2rem .3rem rgba(var(--accent),calc(var(--amb) * .9)),0 0 5rem 1.2rem rgba(var(--accent),calc(var(--amb) * .5))}
.amb.top::before{top:0}.amb.bottom::before{bottom:0}
#app.noamb #ambient{opacity:0;transition:opacity .6s}

/* ───────── shared glass ───────── */
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--brd);
  box-shadow:0 .1rem 0 rgba(255,255,255,.06) inset,0 1.2rem 3.5rem rgba(0,0,0,.35)}
.ico{width:1.7rem;height:1.7rem;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.f{fill:currentColor;stroke:none}
.widget{transition:opacity .45s ease,transform .45s ease}
#app.bare .widget{opacity:0;pointer-events:none}
#app.bare #lyrics{opacity:0}
#app.bare #aboveBar{opacity:1}
#app.bare #focusBtn{width:3.6rem;height:3.6rem;background:rgba(28,28,34,.42);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--brd);box-shadow:0 .6rem 2rem rgba(0,0,0,.3);opacity:.7;
  /* move to the horizontal centre of the screen, in the player-bar row */
  transform:translate(calc(var(--W) * .19 - 57rem), 4.8rem)}
#app.bare #focusBtn:hover{opacity:1}
#focusBtn{transition:transform .35s,opacity .25s}

/* ───────── clock ───────── */
#clock{position:absolute;left:50%;top:6.6%;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;pointer-events:none}
#date{position:relative;font-size:1.45rem;font-weight:600;letter-spacing:.01em;color:var(--clock);opacity:calc(.85 * var(--ckA, 1));margin-bottom:.8rem;transition:color 1.2s;text-shadow:0 .1rem .8rem rgba(0,0,0,.35)}
#clockSvg{position:relative;color:var(--clock);height:23rem;overflow:visible;opacity:calc(.97 * var(--ckA, 1));filter:drop-shadow(0 .3rem 1.1rem rgba(0,0,0,.28)) drop-shadow(0 0 .7rem rgba(var(--accent),.16))}
#clockSvg .ck-rim{stroke:rgba(0,0,0,.2)}
#clockSvg .ck-body{stroke:var(--clock);transition:stroke 1.2s}
#clockSvg .ck-dots circle{fill:var(--clock);stroke:rgba(0,0,0,.2);stroke-width:1;transition:fill 1.2s}

/* ───────── lyrics ───────── */
#lyrics{display:none;position:absolute;left:53%;top:50%;width:27rem;z-index:3;pointer-events:none;transition:opacity .5s}
#lyrics .lprev{font:400 1.3rem/1.1 Anton,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;color:rgba(255,255,255,.55);letter-spacing:.04em;margin-bottom:.8rem;min-height:1.6rem;transition:opacity .4s}
#lyrics .lcur{font:400 3.7rem/1 Anton,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.01em}
#lyrics .w{display:inline-block;margin-right:.9rem;padding:0 .25rem;color:transparent;-webkit-text-stroke:.09rem rgba(255,255,255,.62);
  opacity:0;transform:translateY(.5rem);filter:blur(.3rem);transition:opacity .35s,transform .35s,filter .35s,background .15s,color .15s}
#lyrics .w.in{opacity:1;transform:none;filter:none}
#lyrics .w.done{color:rgba(255,255,255,.92);-webkit-text-stroke:0}
#lyrics .w.on{background:#fff;color:#111;-webkit-text-stroke:0}
#app.nolyr #lyrics,#app.searching #lyrics{opacity:0}
/* full-lyrics mode (eye): cover + playlist hidden, big centred lyrics under the clock */
#app.lyricsmode #lyrics{opacity:0}
#lyrics2{--lys:4.4rem;position:absolute;left:50%;top:39%;transform:translateX(-50%);width:46rem;height:34rem;text-align:center;z-index:3;pointer-events:none;opacity:0;transition:opacity .5s}
#app.lyricsmode #lyrics2{opacity:1}
#app.lys-s #lyrics2{--lys:3.4rem}#app.lys-l #lyrics2{--lys:5.6rem}
#app.ly-condensed #lyrics2 .ln,#app.ly-condensed #lyrics2 .al{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em}
#app.ly-serif #lyrics2 .ln,#app.ly-serif #lyrics2 .al{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600}
#app.ly-clean #lyrics2 .ln,#app.ly-clean #lyrics2 .al{font-family:Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
#app.ly-mono #lyrics2 .ln{font-family:"Space Mono",ui-monospace,monospace;font-weight:700;font-size:calc(var(--lys) * .8)}#app.ly-mono #lyrics2 .al{font-family:"Space Mono",ui-monospace,monospace;font-weight:700}
#app.lc-lower #lyrics2 .w2,#app.lc-lower #lyrics2 .aw{text-transform:lowercase}#app.lc-upper #lyrics2 .w2,#app.lc-upper #lyrics2 .aw{text-transform:uppercase}
#lyrics2 .tr2{display:block;max-width:40rem;margin:1.1rem auto 0;font:700 calc(var(--lys) * .34)/1.3 Inter,system-ui,sans-serif;font-style:normal;letter-spacing:0;color:rgba(var(--lyc, 255,255,255),calc(.82 * var(--lyA, 1)));text-transform:none}
/* clock styles */
#clock{transition:opacity .45s}
#app.noclock #clock{opacity:0}
#clockTxt{position:relative;opacity:var(--ckA, 1);display:none;color:var(--clock);white-space:nowrap;line-height:.86;text-shadow:0 .3rem 1.2rem rgba(0,0,0,.25);transition:color 1.2s}
#app.ck-thin #clockSvg,#app.ck-rounded #clockSvg,#app.ck-serif #clockSvg,#app.ck-condensed #clockSvg,#app.ck-mono #clockSvg{display:none}
#app.ck-thin #clockTxt,#app.ck-rounded #clockTxt,#app.ck-serif #clockTxt,#app.ck-condensed #clockTxt,#app.ck-mono #clockTxt{display:block}
#app.ck-thin #clockTxt{font:200 25rem/.84 "Big Shoulders Display","Arial Narrow",sans-serif}
#app.ck-rounded #clockTxt{font:900 15.5rem/.92 Nunito,"Arial Rounded MT Bold",sans-serif;letter-spacing:-.03em}
#app.ck-serif #clockTxt{font:500 16.5rem/.92 "Playfair Display",Georgia,serif;letter-spacing:-.02em}
#app.ck-condensed #clockTxt{font:400 21rem/.9 Anton,Impact,sans-serif;letter-spacing:.01em}
#app.ck-mono #clockTxt{font:700 13rem/.96 "Space Mono",ui-monospace,monospace;letter-spacing:-.06em}
#app.nolyr #lyrics2,#app.searching #lyrics2,#app.bare #lyrics2{opacity:0!important}
#lyrics2 .ln{position:absolute;left:0;right:0;top:0;font:900 var(--lys)/.98 Nunito,"SF Pro Rounded","Arial Rounded MT Bold","Segoe UI Black",system-ui,sans-serif;color:rgba(var(--lyc, 255,255,255),var(--lyA, 1));letter-spacing:-.01em;text-shadow:0 .25rem 1.4rem rgba(0,0,0,calc(.4 * var(--lyA, 1)));transition:opacity .55s,filter .55s,transform .55s}
#lyrics2 .ln.out{opacity:0;filter:blur(.9rem);transform:translateY(-2.4rem)}
#lyrics2 .ln.note{display:flex;flex-direction:column;align-items:center;gap:1.4rem}
#lyrics2 .ln.note .nt{display:block;font:400 calc(var(--lys) * 1.1)/1 Inter,system-ui,sans-serif;animation:notebob 1.8s ease-in-out infinite}
#lyrics2 .ln.note .nd{display:flex;gap:.9rem}
#lyrics2 .ln.note .nd i{width:calc(var(--lys) * .2);height:calc(var(--lys) * .2);border-radius:50%;background:rgba(var(--lyc, 255,255,255),.22);transition:background .35s,transform .35s}
#lyrics2 .ln.note .nd i.on{background:rgba(var(--lyc, 255,255,255),var(--lyA, 1));transform:scale(1.18)}
@keyframes notebob{50%{transform:translateY(-.5rem) rotate(-6deg)}}
.tm{display:flex;align-items:center;gap:.5rem}.tm b{min-width:5.2rem;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer}.tm .chip{min-width:2.6rem}
#lyrics2 .w2{display:block;overflow:clip;overflow-clip-margin:.3em;max-height:calc(var(--lys) * 1.3);opacity:1;transition:max-height .4s ease,opacity .4s,transform .4s,filter .4s}
#lyrics2 .w2.future{max-height:0;opacity:0;transform:translateY(.9rem) scale(.88);filter:blur(.5rem)}
/* words that run into the next one (no space between: Chinese, Japanese…) */
#lyrics2 .w2.j{margin-right:0!important}#lyrics2 .w2.j+.w2{margin-left:0!important}
/* Apple Music-style view */
#app.lfx-apple #lyrics2{--apo:50%;-webkit-mask-image:linear-gradient(transparent,#000 13%,#000 74%,transparent);mask-image:linear-gradient(transparent,#000 13%,#000 74%,transparent)}
#app.lfx-apple.lypos-left #lyrics2,#app.lfx-apple.lypos-right #lyrics2{--apo:0%}
#app.lfx-apple.lypos-center #lyrics2{top:36%;height:26rem;width:52rem}
#app.lfx-apple.editing #lyrics2{-webkit-mask-image:none;mask-image:none;overflow:hidden}
#lyrics2 .ap{position:absolute;left:0;right:0;top:0}
#lyrics2 .al{padding:calc(var(--lys) * .17) 0;font:800 calc(var(--lys) * .66)/1.16 Nunito,"SF Pro Rounded","Arial Rounded MT Bold","Segoe UI Black",system-ui,sans-serif;letter-spacing:-.01em;
  color:rgba(var(--lyc, 255,255,255),var(--lyA, 1));text-shadow:0 .2rem 1.2rem rgba(0,0,0,calc(.35 * var(--lyA, 1)));opacity:.3;filter:blur(calc(var(--dist, 1) * .55px));scale:.96;transform-origin:var(--apo) 50%;
  transition:transform .8s cubic-bezier(.2,.85,.25,1),opacity .55s ease,filter .55s ease,scale .6s cubic-bezier(.2,.85,.25,1)}
#lyrics2 .al.past{opacity:.2}
#lyrics2 .al.on{opacity:1;filter:none;scale:1}
#lyrics2 .al.far{visibility:hidden}
#lyrics2 .aw{display:inline-block;transition:transform .7s cubic-bezier(.2,.85,.25,1),filter .4s}
#lyrics2 .al.on.timed .aw{color:transparent;text-shadow:none;background-image:linear-gradient(90deg,rgba(var(--lyc, 255,255,255),var(--lyA, 1)) 45%,rgba(var(--lyc, 255,255,255),calc(.36 * var(--lyA, 1))) 55%);
  background-size:260% 100%;background-position:calc((1 - var(--f, 0)) * 100%) 0;-webkit-background-clip:text;background-clip:text;padding:.08em 0;margin:-.08em 0}
#lyrics2 .al.on .aw.up{transform:translateY(-.05em)}
#lyrics2 .al.on .aw.em.glow{transform:translateY(-.07em) scale(1.06);filter:drop-shadow(0 0 .22em rgba(var(--lyc, 255,255,255),.55))}
#lyrics2 .al:not(.on):not(.timed) .aw,#lyrics2 .al.on:not(.timed) .aw{color:inherit}
#lyrics2 .atr{margin-top:.25em;font:600 calc(var(--lys) * .3)/1.3 Inter,system-ui,sans-serif;letter-spacing:0;text-transform:none;opacity:.78}
#lyrics2 .al.dots{display:flex;gap:calc(var(--lys) * .17);align-items:center;justify-content:var(--apj, center);height:calc(var(--lys) * .9);opacity:0}
#app.lypos-left #lyrics2 .al.dots,#app.lypos-right #lyrics2 .al.dots{--apj:flex-start}
#lyrics2 .al.dots.on{opacity:1;animation:apbreathe 2.6s ease-in-out infinite}
#lyrics2 .al.dots.on.end{animation:none;scale:.6;opacity:0;transition:scale .4s,opacity .4s}
#lyrics2 .al.dots i{width:calc(var(--lys) * .17);height:calc(var(--lys) * .17);border-radius:50%;background:rgba(var(--lyc, 255,255,255),calc(.3 * var(--lyA, 1)));transition:background .5s}
#lyrics2 .al.dots i.on{background:rgba(var(--lyc, 255,255,255),var(--lyA, 1))}
@keyframes apbreathe{0%,100%{scale:.92}50%{scale:1.08}}
#lyrics2 .w2.gone{max-height:0;opacity:0;transform:translateY(-.9rem) scale(.94);filter:blur(.7rem)}

/* ───────── playlist (left, text-only, tilted toward the centre) ───────── */
#queue{position:absolute;left:1.6%;top:19%;width:26rem;height:72%;z-index:4;transform:perspective(52rem) rotateY(33deg);transform-origin:left center;transition:opacity .45s,transform .45s}
#queue.off{opacity:0;pointer-events:none;transform:perspective(52rem) rotateY(33deg) translateX(-1.5rem)}
.qhead{display:flex;align-items:center;gap:.8rem;padding:0 .2rem;margin-bottom:2.2rem}
.qt{flex:1;min-width:0;cursor:pointer}
.qt b{display:flex;align-items:center;gap:.35rem;font-size:1.75rem;font-weight:700;text-shadow:0 .1rem .8rem rgba(0,0,0,.45)}
.qt b .ico{width:1.3rem;height:1.3rem;transition:transform .3s}
#queue.collapsed .qt b .ico{transform:rotate(-90deg)}
.qt span{display:block;font-size:1.08rem;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15rem}
.qbtns{display:flex;gap:.6rem;flex:none}.qbtn.on{background:rgba(255,255,255,.9);color:#111;border-color:transparent}
.qbtn{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);flex:none;transition:background .2s,transform .4s}
.qbtn:hover{background:rgba(255,255,255,.16)}
.qbtn.spin{transform:rotate(360deg)}
.qbtn .ico{width:1.3rem;height:1.3rem}
#qlist{list-style:none;height:calc(100% - 6rem);overflow-y:auto;padding-right:1.4rem;padding-left:1.4rem;margin-left:-1.4rem;   /* room for the rows' rounded highlight, which reaches .7rem past the text */
  border-right:1px solid rgba(255,255,255,.28);scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent);mask-image:linear-gradient(to bottom,#000 78%,transparent);transition:opacity .3s}
#qlist::-webkit-scrollbar{display:none}
#queue.collapsed #qlist{opacity:0;pointer-events:none}
.qi{padding:.75rem .7rem;margin:0 -.7rem .55rem;border-radius:1.1rem;cursor:pointer;transition:background .2s}
.qi:hover{background:rgba(255,255,255,.08)}
.qi b{display:block;font-size:1.5rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .1rem .6rem rgba(0,0,0,.45)}
.qi span{display:block;font-size:1.12rem;color:var(--txt2);margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi.cur{background:rgba(var(--accent),.28);box-shadow:0 0 0 1px rgba(var(--accent),.45) inset}
.qi .eq{display:none}
/* queue items: drag handle, play next, remove (shown on hover) */
.qi{display:flex;align-items:center;gap:.4rem;position:relative}
.qi .qm{flex:1;min-width:0}
.qi .qg{flex:none;width:1.6rem;margin-left:-.5rem;display:grid;place-items:center;opacity:0;cursor:grab;color:var(--txt2);transition:opacity .2s;touch-action:none}
.qi .qg .ico{width:1.5rem;height:1.5rem}
.qi .qx{flex:none;display:flex;gap:.35rem;opacity:0;transition:opacity .2s}
.qi:hover .qg,.qi:hover .qx{opacity:1}
.qi .qx button{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.qi .qx button:hover{background:rgba(255,255,255,.22)}
.qi .qx .ico{width:1.2rem;height:1.2rem}
.qi.lift{opacity:.45}
.qi.dropb::before,.qi.dropa::after{content:"";position:absolute;left:.4rem;right:.4rem;height:.22rem;border-radius:.2rem;background:rgb(var(--accent));box-shadow:0 0 .8rem rgba(var(--accent),.8)}
.qi.dropb::before{top:-.4rem}.qi.dropa::after{bottom:-.4rem}
#qlist.reorder,#qlist.reorder *{cursor:grabbing!important;user-select:none}
.qempty{font-size:1.15rem;color:var(--txt2);padding:.4rem 0}
.eq{display:inline-flex;gap:.18rem;align-items:flex-end;height:1.1rem}
.eq i{display:block;width:.22rem;height:30%;background:#fff;border-radius:.1rem;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* ───────── glass cover flow (centre) ───────── */
#flowWrap{position:absolute;left:0;right:0;top:38.6%;height:29.4%;z-index:5;pointer-events:none}
#flowLabel{position:absolute;left:50%;top:-2.5rem;transform:translateX(-50%);display:flex;align-items:center;gap:.5rem;font-size:1.15rem;font-weight:700;color:rgba(255,255,255,.85);opacity:0;transition:opacity .3s;white-space:nowrap;text-shadow:0 .1rem .6rem rgba(0,0,0,.4)}
#flowLabel .pi{width:1.6rem;height:1.6rem}
#flowLabel small{font-weight:500;color:var(--txt2)}

/* ════════════════════ glass cover flow (centre) ════════════════════ */

    FLOW.key = sig; host.innerHTML = ''; FLOW.els = [];
    list.slice(0, 60).forEach((t, i) => { const el = document.createElement('div'); el.className = 'fc'; el.dataset.i = i;
      el.innerHTML = `<div class="fa"><img src="${esc(t.art || '')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="pl">${I.play}</span><a class="open" href="#" title="Open in platform">${I.ext}</a></div><b>${esc(t.title)}</b><span>${esc(t.sub || t.artist)}</span>`;

const songKey = t => (t.title + '|' + t.artist).toLowerCase();

// one song picked: play it now, then fill "Continue Playing" — YouTube's Mix for it ("Danh sách kết hợp"),
// or (Settings → Playback) YouTube's suggestions mixed with the account's picks
async function pickSong(t, list){
  const mix = (S.look.pick || 'mix') === 'mix';
  S.radioKey = t.title + '|' + t.artist; S.qLabel = 'Finding songs for you…'; playTrack(t, [t]); renderQueue();
  try {
    const r = await invoke(mix ? 'mix' : 'suggest', {id: t.play});
    const more = (r.tracks || []).map(mapTrack).filter(x => songKey(x) !== songKey(t)); if (!more.length) throw 0;
    if (!S.track || songKey(S.track) !== songKey(t) || S.qKind !== 'queue') return;      // the user already moved on
    const added = S.queue.filter(x => x !== t), have = new Set(added.map(songKey));        // songs added meanwhile stay first
    S.queue = [t, ...added, ...more.filter(x => !have.has(songKey(x)))]; S.qIdx = 0; S.qKind = 'queue';
    S.mix = mix ? {seed: t.play, title: t.title, cont: r.cont || ''} : null;
    S.qLabel = (mix ? 'Mix · ' : r.personal ? 'Picked for you · ' : 'Radio · ') + t.title; renderQueue(); renderFlow(true);
  } catch(e){
    if (!S.track || songKey(S.track) !== songKey(t)) return;
    if (list && list.length > 1){ S.queue = list.includes(t) ? list.slice() : [t, ...list]; S.qIdx = S.queue.indexOf(t); S.qKind = 'queue'; S.mix = null; S.qLabel = `Songs like ${t.title}`; renderQueue(); renderFlow(true) }
    else { S.qLabel = `Songs like ${t.title}`; renderQueue(); maybeRadio(true) }
  }
}

/* ════════════════════ tray icon: the album cover, with a ring that beats ════════════════════ */
// While a song plays the icon by the clock shows its cover in a circle; a ring around it follows the beat.
// Paused: the cover stays, without the ring. Nothing playing (or switched off): Wallplayer's own icon.
const TRAY = {key: '', cv: null, busy: false};
function trayTick(){
  if (!T || MIRROR || TRAY.busy) return;
  const on = S.look.trayArt !== false && S.artImg && S.track;
  if (!on){ if (TRAY.key !== 'default'){ TRAY.key = 'default'; invoke('set_tray_art', {rgba: null}).catch(() => {}) } return }
  const pl = isPlaying(), lvl = pl ? Math.round(clamp(AU.beat * .8 + AU.energy * .6, 0, 1) * 6) : -1;
  const key = (S.track.title + '|' + S.track.artist) + '|' + lvl + '|' + (S.tgtA || []).join(',');
  if (key === TRAY.key) return; TRAY.key = key;
  const N = 32, cv = TRAY.cv || (TRAY.cv = Object.assign(document.createElement('canvas'), {width: N, height: N})), x = cv.getContext('2d', {willReadFrequently: true});
  x.clearRect(0, 0, N, N);
  const r = pl ? 11.5 : 14.5;   // room for the ring while playing
  x.save(); x.beginPath(); x.arc(N / 2, N / 2, r, 0, 6.2832); x.clip();
  try { const im = S.artImg, sc = Math.max(N / im.width, N / im.height) * (r * 2 / N); x.drawImage(im, N / 2 - im.width * sc / 2, N / 2 - im.height * sc / 2, im.width * sc, im.height * sc) } catch(e){}
  x.restore();
  if (pl){ const a = S.tgtA || [255, 255, 255], k = lvl / 6;
    x.beginPath(); x.arc(N / 2, N / 2, 14.2, 0, 6.2832); x.lineWidth = 1.4 + k * 1.6; x.strokeStyle = `rgba(${a.join(',')},${(.45 + k * .55).toFixed(2)})`; x.stroke() }
  let px; try { px = x.getImageData(0, 0, N, N).data } catch(e){ return }   // a cover from another site without CORS: keep the icon
  let b = ''; for (let i = 0; i < px.length; i += 8192) b += String.fromCharCode.apply(null, px.subarray(i, i + 8192));
  TRAY.busy = true; invoke('set_tray_art', {rgba: btoa(b)}).catch(() => {}).finally(() => TRAY.busy = false);
}
setInterval(trayTick, 110);

// The app checks quietly at start; a newer version only changes the tray menu item to "Update available".
// That item, "Check for updates" and Appearance → Updates open the card: release notes with Skip / Update.
const UP = {current: '', auto: true, state: 'idle', version: '', notes: '', url: '', error: '', just_updated: false, card: false};
const upPage = v => `https://github.com/lehuynhtan17/Wallplayer/releases/tag/V${v}`;
const upFound = () => ['available', 'downloading', 'ready'].includes(UP.state) && !!UP.version;
function upText(){
  if (!T) return 'Updates work in the Windows app';
  const cur = UP.current ? `Wallplayer ${UP.current}` : 'Wallplayer';
  return {checking: 'Looking for a new version…', available: `Wallplayer ${UP.version} is available`, downloading: `Downloading Wallplayer ${UP.version}…`,
    ready: `Wallplayer ${UP.version} is ready`, latest: `${cur} · up to date`, error: `${cur} · couldn't check${UP.error ? ': ' + UP.error : ''}`}[UP.state] || cur;
}
function upBtns(){
  const busy = UP.state === 'checking';
  return (upFound() ? `<button class="chip on" id="upCheck">Update available: v${esc(UP.version)}</button>` : `<button class="chip" id="upCheck" ${busy ? 'disabled' : ''}>${busy ? 'Checking…' : 'Check for updates'}</button>`)
    + (UP.current ? `<button class="chip" id="upNotes">What's new</button>` : '');
}
// release notes are markdown: headings, bullets, **bold**, *italic* are enough
function mdLite(md){
  return esc(md || '').split(/\r?\n/).map(l => {
    const t = l.trim(); if (!t) return '';
    const b = x => x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/`(.+?)`/g, '<code>$1</code>').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
    if (/^#{1,6}\s/.test(t)) return `<h4>${b(t.replace(/^#+\s*/, ''))}</h4>`;
    if (/^[-*•]\s/.test(t)) return `<li>${b(t.replace(/^[-*•]\s*/, ''))}</li>`;
    return `<p>${b(t)}</p>`;
  }).join('');
}
function renderCard(){
  const c = $('#upCard'); if (!UP.card){ c.classList.remove('on'); return }
  const has = upFound() || (UP.state === 'error' && UP.version && UP.going);
  const head = has ? `<h3>Wallplayer ${esc(UP.version)}</h3><div class="lnote">You have ${esc(UP.current)}</div>` : '<h3>Updates</h3>';
  const notes = has ? `<div class="upNotes">${mdLite(UP.notes) || '<p>No release notes.</p>'}</div>` : '';
  const line = {checking: 'Looking for a new version…', latest: `You have the latest version (${esc(UP.current)}).`,
    downloading: 'Downloading…', ready: 'Restarting with the new version…', error: `Couldn't ${UP.going ? 'update' : 'check'}: ${esc(UP.error || 'unknown error')}`}[UP.state] || '';
  const btns = UP.state === 'available' ? '<button class="chip" data-up="skip">Skip</button><button class="chip on" data-up="update">Update</button>'

}

  $('#upMsg').textContent = `Updated to Wallplayer ${UP.current}`; $('#upGo').textContent = "What's new"; $('#upX').textContent = '✕'; $('#upPill').classList.add('on');
}

const vivid = c => { const [h, s, l] = rgb2hsl(...c); return hsl2rgb(h, s < .08 ? s : clamp(s * 1.25 + .08, 0, 1), clamp(l, .38, .66)) };
const vidCanvas = document.createElement('canvas'); vidCanvas.width = 32; vidCanvas.height = 18;
function localVideoColors(){   // a wallpaper video file: readable directly
  const v = $('#customVid'); if (!app.classList.contains('hasCustom') || !v.classList.contains('on') || v.readyState < 2) return null;
  try { const x = vidCanvas.getContext('2d', {willReadFrequently: true}); x.drawImage(v, 0, 0, 32, 18); const d = x.getImageData(0, 0, 32, 18).data;
    const zone = (x0, x1) => { let r = 0, g = 0, b = 0, n = 0; for (let y = 3; y < 12; y++) for (let k = x0; k < x1; k++){ const i = (y * 32 + k) * 4; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++ } return [r / n, g / n, b / n] };
    return [zone(6, 11), zone(21, 26)] } catch(e){ return null }
}
const FRAMES = {};   // YouTube's own preview frames of the video (25 %, 50 %, 75 %), used when the screen itself can't be read
function frameColors(id, frac){
  if (!id) return null; const n = frac < .375 ? 1 : frac < .625 ? 2 : 3, k = id + n, f = FRAMES[k];
  if (!f){ const im = new Image(); im.crossOrigin = 'anonymous'; FRAMES[k] = {im, c: null}; im.onload = () => { try { const x = vidCanvas.getContext('2d', {willReadFrequently: true}); x.drawImage(im, 0, 0, 32, 18);
      const d = x.getImageData(0, 0, 32, 18).data, zone = (x0, x1) => { let r = 0, g = 0, b = 0, c = 0; for (let y = 2; y < 16; y++) for (let q = x0; q < x1; q++){ const i = (y * 32 + q) * 4; r += d[i]; g += d[i + 1]; b += d[i + 2]; c++ } return [r / c, g / c, b / c] };
      FRAMES[k].c = [zone(2, 12), zone(20, 30)] } catch(e){} }; im.src = `https://i.ytimg.com/vi/${id}/${n}.jpg`; return null }
  return f.c;
}
function liveVideoId(){ const p = S.mvOn && YTV.ids.length ? YTV : YTA; return p.ids[p.i] || null }
function liveFrac(){ const p = S.mvOn && YTV.ids.length ? YTV : YTA, d = p.dur(); return d ? p.time() / d : .5 }
let vidBusy = false;
async function pollVideoColors(){
  if (vidBusy) return; if (S.look.acol !== 'video'){ S.vidA = S.vidB = null; return }
  vidBusy = true;
  try {
    let c = localVideoColors();
    if (!c && T && !document.hidden && (S.mvOn || S.src === 'yt' || S.src === 'sc')){ try { c = await invoke('screen_colors') } catch(e){} }
    if (!c){ try { c = frameColors(liveVideoId(), liveFrac()) } catch(e){} }

/* ── self-test: shows what actually works on this PC ── */
async function selfTest(){
  const L = []; const ok = (n, v, e) => L.push(`${v ? '✓' : '✗'} ${n}${e ? ' — ' + e : ''}`);
  if (!T){ toast('Self-test only runs in the Wallplayer app'); return }
  try { const v = await invoke('get_volume'); ok('Windows volume', true, Math.round(v[0] * 100) + '%' + (v[1] ? ' (muted)' : '')) } catch(e){ ok('Windows volume', false, e) }
  try { ok('Show-desktop watcher', true, await invoke('debug_state')) } catch(e){ ok('Show-desktop watcher', false, e) }
  try { const c = await invoke('screen_colors'); ok('Screen colour sampling', true, JSON.stringify(c)) } catch(e){ ok('Screen colour sampling', false, e + ' (normal when an app window covers the screen)') }
  const id = liveVideoId() || (S.track && S.track.source === 'youtube' && S.track.play);
  if (id){
    try { const c = await invoke('yt_captions', {videoId: id}); ok('YouTube captions', c.length > 0, c.length + ' lines for ' + id) } catch(e){ ok('YouTube captions', false, e) }
    const fc = FRAMES[id + 1]; ok('Video frame colours', !!(fc && fc.c), fc ? (fc.c ? 'loaded' : 'loading / blocked') : 'not requested yet')
    for (const pl of [YTV, YTA]){ try { const q = pl.p && pl.p.getPlaybackQuality(); if (q) ok('Quality now (' + (pl === YTV ? 'wallpaper' : 'clip') + ')', true, q + ' of ' + (pl.p.getAvailableQualityLevels() || []).join(',')) } catch(e){} }
  } else ok('YouTube checks', false, 'play a YouTube track first, then run again')
  let d = $('#diag'); if (!d){ d = document.createElement('div'); d.id = 'diag'; d.className = 'glass'; d.onclick = () => d.remove(); document.body.appendChild(d) }
  d.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99;max-width:70rem;padding:2rem 2.4rem;font:500 1.3rem/1.7 system-ui;white-space:pre-wrap;word-break:break-all;pointer-events:auto;border-radius:1.4rem';
  d.textContent = 'Self-test (click to close)\n\n' + L.join('\n');

/* ════════════════════ main loop ════════════════════ */
// Runs every display frame while something moves. At rest (no music, no sound) it eases the
// motion to a stop and then only looks around 4× a second; asleep (covered) once a second.
let lastT = performance.now(); var loopRaf = 0, loopTimer = 0, lastAmb = '';   // var: PW.kick() may run before this line

function frame(now){
  loopRaf = 0;
  if (PW.low() && now - lastT < 30 && !PW.asleep()){ loopRaf = requestAnimationFrame(frame); return }   // ~30 fps when lighter
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  if (S.src === 'demo' && S.demo.playing){ S.demo.pos += dt; if (S.demo.pos >= getDur()) onEnded() }
  const pos = getPos(), dur = getDur(), pl = isPlaying();
  $('#prog i').style.width = dur ? (clamp(pos / dur, 0, 1) * 100).toFixed(2) + '%' : '0%';
  if (S.lyrOn) lyricsTick(pos);
  // energy: real system-audio spectrum in the app, tempo-locked synth in the browser demo
  if (T){ if (now - AU.lastAt > 120) AU.feed(ZERO33, now) }
  else AU.feed(pl ? synthSpectrum(pos, (S.track && S.track.bpm) || 96) : ZERO33, now);
  AU.decay(dt);
  S.amb = clamp(.2 + AU.energy * .7 + AU.beat * .4, 0, 1.3);
  const ambS = S.amb.toFixed(3); if (ambS !== lastAmb){ lastAmb = ambS; document.documentElement.style.setProperty('--amb', ambS) }
  // rest: nothing plays and the room is quiet for 1.5 s
  const loud = AU.energy > .03 || AU.beat > .05;
  PW.quiet = pl || loud ? 0 : PW.quiet + dt;
  const want = PW.quiet > 1.5 && !PW.preview ? 0 : 1;   // a preview keeps it moving even in silence
  PW.motion += (want - PW.motion) * Math.min(1, dt * (want ? 6 : 2)); if (PW.motion < .01) PW.motion = 0;
  const rest = PW.motion === 0, asleep = PW.asleep(), kicked = now < PW.until;
  if (rest !== app.classList.contains('rest')) app.classList.toggle('rest', rest);
  if (!asleep && (!rest || kicked)){
    if (AMB && ambHere()) AMB.render(dt, S.vidA || S.tgtA, S.vidB || S.tgtB, PW.motion);
    FX.draw(now, PW.motion);
  }
  if (S.look.lfx === 'glow') $('#lyrics2').style.setProperty('--beat', AU.beat.toFixed(3));
  if (asleep) loopTimer = setTimeout(() => { loopTimer = 0; loopRaf = requestAnimationFrame(frame) }, 1000);
  else if (rest && !kicked) loopTimer = setTimeout(() => { loopTimer = 0; loopRaf = requestAnimationFrame(frame) }, 250);
  else loopRaf = requestAnimationFrame(frame);
}
// end screens (suggested-video tiles) sit on the last ~20 s of a music video: fade to the cover there
function ytEndGuard(){ if (!YTV.p) return; const d = YTV.dur(), t = YTV.time(); $('#ytWrap').classList.toggle('yt-end', d > 40 && d - t < 20) }
setInterval(() => { renderClock(); if (S.src !== 'demo') renderPlay(); mvSync(); ytEndGuard(); followOther() }, 1000);

/* ════════════════════ mirror windows (other monitors) ════════════════════ */
// The other monitors run this same page in mirror mode. They read the same saved
// settings (clock, lyrics, ambient, layout, background…) and redraw when they change;
// the main window tells them what plays: track, position, lyrics, playlist, video.
const MIR = {tk: '', qk: '', lk: -1};
function mirrorSync(force){
  if (!T || MIRROR) return;
  const t = S.track, clip = app.classList.contains('clip');
  const P = clip ? YTA : YTV;
  const video = (clip || $('#ytWrap').classList.contains('on')) ? (P.ids[P.i] || null) : null;
  const m = {pos: getPos(), playing: isPlaying(), video, vt: video ? P.time() : 0, vpl: video ? P.playing() : false, clip, at: Date.now(),
    dur: getDur(), lo: (S.lyrOff || 0) + (S.lyrOffAll || 0), acc: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(), islLyr: S.look.islLyr !== false, dim: !!S.dim};
  const tk = t ? t.title + '|' + t.artist + '|' + (t.art || '').length : '';
  if (force || tk !== MIR.tk){ MIR.tk = tk; m.track = t ? {...t, lyrics: undefined} : null; m.hasTrack = true }
  const list = queueList(), qk = list.length + '|' + list.slice(0, 30).map(x => x.title).join('|') + '|' + (t ? t.title : '');
  if (force || qk !== MIR.qk){ MIR.qk = qk; m.queue = list.slice(0, 30).map(x => ({...x, lyrics: undefined})); m.qIdx = list.findIndex(isCurrent) }
  if (force || m.hasTrack || S.lyrSeq !== MIR.lk){ MIR.lk = S.lyrSeq; m.lyr = S.lyr; m.lyrSrc = S.lyrSource }
  // TikTok: the other displays show the same video (muted), its details and the next ones
  if (TT.on){
    const c = TT.list[TT.i] || null, nx = TT.list.slice(TT.i + 1, TT.i + 4), signed = !!(S.acc && S.acc.tiktok);
    const k = [c && c.id, c && c.liked, c && c.saved, c && c.likes, c && c.saves, nx.map(x => x.id).join(','), TT.mode, TT.q, signed, S.look.ttAuto !== false].join('|');
    m.tt = {on: true, pos: TT.pos, playing: TT.playing};
    if (force || k !== MIR.ttk){ MIR.ttk = k; Object.assign(m.tt, {clip: c, next: nx, mode: TT.mode, q: TT.q, signed}) }
  } else if (force || MIR.ttk !== 'off'){ MIR.ttk = 'off'; m.tt = {on: false} }
  T.event.emit('mirror-state', m).catch(() => {});
}
setInterval(() => mirrorSync(false), 500);

const MS = {pos: 0, at: 0, playing: false, vid: null, vt: 0, vpl: false};
function mirrorApply(m){
  if (!m) return;
  S.src = 'mirror';
  MS.pos = m.pos || 0; MS.playing = !!m.playing; MS.at = performance.now() - Math.max(0, Math.min(2000, Date.now() - (m.at || Date.now())));
  MS.vt = m.vt || 0; MS.vpl = !!m.vpl;
  if (m.queue){ S.queue = m.queue; S.qKind = 'queue'; S.qIdx = m.qIdx }
  if (m.hasTrack) setTrack(m.track || null);
  else if (m.queue){ renderQueue(); renderFlow() }
  if (m.lyr) setLyrics(m.lyr, S.track, m.lyrSrc);
  if (m.tt) mirrorTT(m.tt);
  app.classList.toggle('clip-mirror', !!m.clip);
  const vid = S.look.bg === 'desktop' && !m.clip ? null : (m.video || null);
  if (vid !== MS.vid){ MS.vid = vid; if (vid) YTV.load([vid], MS.vt); else YTV.stop() }
  renderPlay();
}
// TikTok on the main display → the same vertical video here (muted, following the main one)
function mirrorTT(t){
  if (!t.on){
    if (TT.on){ TT.on = false; app.classList.remove('tt'); TT.unload(); TT.list = []; TT.i = -1; $('#ttCover').removeAttribute('src'); S.platform = store.get('platform', 'auto'); renderPlatMenu() }
    return;
  }
  if (!TT.on){ TT.on = true; app.classList.add('tt'); S.platform = 'tiktok'; renderPlatMenu() }
  if ('clip' in t){
    TT.mode = t.mode || 'foryou'; TT.q = t.q || ''; TT.signed = !!t.signed;
    const was = TT.list[0] && TT.list[0].id, id = t.clip && t.clip.id;
    TT.list = t.clip ? [t.clip, ...(t.next || [])] : []; TT.i = t.clip ? 0 : -1;
    if (id !== was) TT.mirrorShow(t.clip);
    renderTT();
  }
  TT.mplay = !!t.playing;
  if (TT.frame && TT.ready){
    if (t.playing && !TT.playing) TT.send('play'); else if (!t.playing && TT.playing) TT.send('pause');
    if (Math.abs((TT.pos || 0) - (t.pos || 0)) > 1.2 && Date.now() - TT.bgSync > 3000){ TT.bgSync = Date.now(); TT.send('seekTo', t.pos || 0) }
  }
}
// settings changed in the main window → redraw with them
function mirrorReload(){
  S.look = Object.assign(S.look, store.get('look', {})); S.hide = Object.assign(S.hide, store.get('hide', {}));
  for (const k of ['lyrOn', 'ambOn', 'dim', 'mvOn', 'qOff']) S[k] = store.get(k, S[k]);
  S.sub = store.get('sub', S.sub);
  if ((S.look.lang || I18N.lang) !== I18N.lang){ location.reload(); return }   // language changed in the main window
  applyLook(); applyHide(); applyToggles(); applyTheme(); applyBg(); setLyricsMode(store.get('lyricsMode', false)); PW.prefs();
  lastClock = ''; renderClock(); S.lyrIdx = -2; applySubs();
}
if (MIRROR) addEventListener('storage', e => { if (e.key && !e.key.startsWith('wp.')) return; clearTimeout(mirrorReload.t); mirrorReload.t = setTimeout(mirrorReload, 60) });

/* ════════════════════ Dynamic Island ════════════════════ */
// A small capsule on top of every window (ui/island.html) shows the song while this player can't be seen:
// a maximised window covers the wallpaper (Automatic), or the player is collapsed (button, H, double-click).
// Never over games, films or slideshows, and gone after five minutes on pause.
// Turned off for now (not needed yet): no island, no settings page, H only hides the interface.
// The island page (ui/island.html) and its Rust side stay in place; set this to true to bring it back.
var ISLAND_ENABLED = false;   // var: islandSync() can run before this line
var ISL = {on: null, pausedAt: 0};   // var: islandSync() can run before this line
function islandWant(){
  if (!T || MIRROR || !ISLAND_ENABLED) return false;
  const mode = S.look.isl || 'auto'; if (mode === 'off' || !S.track) return false;
  if (PW.full) return false;
  const pl = isPlaying(); if (pl) ISL.pausedAt = 0; else if (!ISL.pausedAt) ISL.pausedAt = Date.now();
  if (!pl && Date.now() - ISL.pausedAt > 5 * 60e3) return false;
  if (app.classList.contains('bare')) return true;
  return mode === 'auto' && PW.max;
}
function islandSync(force){
  if (!T || MIRROR || !ISLAND_ENABLED) return; const on = islandWant();
  if (on === ISL.on && !force) return; ISL.on = on;
  invoke('island_show', {on}).catch(() => {}); if (on) setTimeout(() => mirrorSync(true), 400);
}
if (T && !MIRROR) listen('island-cmd', e => {
  const c = e.payload && e.payload.c, v = e.payload && e.payload.v;
  if (c === 'ready'){ mirrorSync(true); return }
  if (c === 'toggle') togglePlay(); else if (c === 'next') next(); else if (c === 'prev') prev();
  else if (c === 'seek'){ const d = getDur(); if (d) seekTo(clamp(+v || 0, 0, 1) * d) }
  else if (c === 'open'){ if (app.classList.contains('bare')) setBare(false); else invoke('peek', {on: true}).catch(() => {}) }
  setTimeout(() => mirrorSync(false), 250);
});

/* ════════════════════ boot ════════════════════ */
async function boot(){
  applyLook(); applyHide(); renderClock(); renderPlatMenu(); applyToggles(); setLyricsMode(store.get('lyricsMode', false));
  IDB.get('wall').then(b => b && applyCustom(b)); applyBg();
  if (T && MIRROR){
    listen('audio-spectrum', e => { AU.feed(e.payload, performance.now()); if (loopTimer && (e.payload[0] || 0) > 1.5e-4) wakeLoop() });
    listen('mirror-state', e => mirrorApply(e.payload));
    listen('wall-changed', () => IDB.get('wall').then(b => applyCustom(b || null)));
    setTrack(null); setAccent(null); setWallArt(null);
    T.event.emit('mirror-hello', {}).catch(() => {});
  } else if (T){
    listen('media-art', e => { S.sysArt = e.payload || null });
    listen('media', e => { onMedia(e.payload); wakeLoop() });
    listen('audio-spectrum', e => { AU.feed(e.payload, performance.now()); if (loopTimer && (e.payload[0] || 0) > 1.5e-4) wakeLoop() });
    listen('hotkey-search', () => openSearch());
    invoke('set_ui_lang', {lang: I18N.lang}).catch(() => {});
    if (LIB.paths.length) invoke('music_allow', {paths: LIB.paths}).catch(() => {});
    listen('tauri://drag-enter', () => app.classList.add('drag')); listen('tauri://drag-leave', () => app.classList.remove('drag'));
    listen('tauri://drag-drop', e => { app.classList.remove('drag'); const ps = (e.payload && e.payload.paths) || []; if (ps.length) dropPaths(ps) });
    listen('bind-captured', e => { if (S.binding) applySearchKey(e.payload) });
    invoke('get_search_key').then(k => { S.searchKey = k; if ($('#appPop').classList.contains('open')) renderAppPop() }).catch(() => {});
    listen('desk-mouse', e => deskMouse(e.payload));
    listen('peek-ended', () => app.classList.remove('searching'));
    listen('mode-changed', e => { S.ui = e.payload });
    listen('accounts-changed', () => refreshAccounts());
    listen('monitor-changed', () => loadMonitors());
    listen('toast', e => toast(e.payload));
    listen('mirror-hello', () => mirrorSync(true));
    try { S.ui = await invoke('get_state') } catch(e){}
    refreshAccounts();
    S.qKind = 'history'; setTrack(null); setAccent(null); setWallArt(null);
  } else {
    buildDemo(); S.queue = DEMO; S.qKind = 'queue'; S.qIdx = 1; S.src = 'demo'; S.demo = {pos: 31, playing: true};
    setTrack(DEMO[1]); S.history = [];
  }
  if (T){ try { PW.set(await invoke('get_power')) } catch(e){} listen('power-state', e => PW.set(e.payload || {})) }
  PW.prefs(); initUpdates();
  if (!MIRROR && S.platform === 'tiktok') TT.enter(false);
  loopRaf = requestAnimationFrame(frame);
}
document.fonts && document.fonts.ready.then(() => { lastClock = ''; renderClock(); if (!T && DEMO.length){ const k = S.qIdx; buildDemo(); S.queue = DEMO; const t = DEMO[k]; S.track = t; applyArt(t.art); setLyrics(t.lyrics, t, 'demo'); renderQueue(); renderFlow(true) } });
boot();
