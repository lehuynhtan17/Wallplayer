[package]
name = "wallplayer"
version = "1.0.18"
description = "Desktop wallpaper music player skin"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
base64 = "0.22"
regex = "1"
urlencoding = "2"
rustfft = "6"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
tokio = { version = "1", features = ["time", "sync"] }
lofty = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
cpal = "0.15"           # WASAPI loopback (audio.rs); Linux / macOS capture the sound their own way
webview2-com = "0.39"   # same version as Tauri's: watch the web engine (guard.rs)
windows-core = "0.62"
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_WinRT",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_TaskScheduler",
] }

# Linux: GTK / WebKitGTK (the same versions Tauri uses), X11 (desktop layer, monitors, mouse button)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gio = "0.18"
glib = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
javascriptcore-rs = { version = "=1.1.2", features = ["v2_28"] }
x11rb = { version = "0.13", features = ["randr"] }
libc = "0.2"

# macOS: AppKit / WebKit through objc2 (the same versions Tauri uses), CoreGraphics
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSGeometry", "NSThread", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSApplication", "NSEvent", "NSGraphics", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView"] }
block2 = "0.6"
core-foundation = "0.10"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
